<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korytarz Versailles — Komiksy AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0a0e;
    --ink: #f5eef4;
    --muted: #a898ab;
    --accent: #e08bbd;
    --gold: #c9a86c;
    --font: "Bricolage Grotesque", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); }

  .hud {
    position: fixed; inset: 0 0 auto 0; z-index: 30;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px; padding: 12px 16px;
    background: linear-gradient(to bottom, rgba(12,10,14,.88), transparent);
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08);
    color: var(--ink); padding: 7px 14px; border-radius: 999px;
    font: 500 13px/1 var(--font); cursor: pointer; backdrop-filter: blur(8px);
  }
  .btn:hover, .btn.active { background: var(--accent); color: #1c1020; border-color: transparent; }
  .counter { font-size: .85rem; color: var(--muted); margin-left: 8px; }

  .hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 30;
    font-size: .85rem; color: var(--muted); background: rgba(0,0,0,.55);
    padding: 7px 16px; border-radius: 999px; backdrop-filter: blur(6px);
    pointer-events: none; transition: opacity .5s;
  }
  .hint.hide { opacity: 0; }

  .scene {
    position: fixed; inset: 0;
    perspective: 1000px;
    perspective-origin: 50% 46%;
    overflow: hidden;
  }
  .corridor {
    position: absolute; left: 50%; top: 0;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transform: translateX(-50%) translateZ(0);
    will-change: transform;
  }

  .floor, .ceiling {
    position: absolute; left: 50%; width: 1600px;
    transform-origin: center top;
  }
  .floor {
    bottom: 0; height: 12000px;
    transform: translateX(-50%) rotateX(90deg) translateZ(-10px);
    background:
      linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.65) 90%),
      repeating-linear-gradient(90deg, #1a151c 0 48px, #241e28 48px 50px),
      repeating-linear-gradient(0deg, #1a151c 0 48px, #241e28 48px 50px);
  }
  .ceiling {
    top: 0; height: 12000px;
    transform: translateX(-50%) rotateX(-90deg) translateZ(-10px);
    background: linear-gradient(to bottom, #0e0c10, #161218);
    opacity: .75;
  }

  .wall {
    position: absolute; top: 0; width: 12000px; height: 100%;
    transform-style: preserve-3d;
  }
  .wall.left  { left: 0;  transform: translateX(-50%) rotateY(90deg) translateZ(-340px); }
  .wall.right { right: 0; transform: translateX(50%) rotateY(-90deg) translateZ(-340px); }
  .wall-inner {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, #1c171f 0%, #141118 55%, #0e0b10 100%);
  }

  .painting {
    position: absolute;
    width: 170px; height: 230px;
    transform-style: preserve-3d;
    cursor: pointer;
    transition: transform .3s cubic-bezier(.2,.8,.2,1), filter .25s;
  }
  .painting:hover {
    transform: translateZ(32px) scale(1.05);
    filter: brightness(1.18);
    z-index: 5;
  }
  .painting .frame {
    position: absolute; inset: -9px;
    background: linear-gradient(145deg, #3d322a, #1c1612 45%, #2a221c);
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 1px #15100c, 0 14px 28px rgba(0,0,0,.55), inset 0 0 18px rgba(0,0,0,.35);
    border-radius: 3px;
  }
  .painting img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 2px;
    background: #1a1518;
  }
  .painting .label {
    position: absolute; bottom: -28px; left: -10px; right: -10px;
    text-align: center; font-size: 10px; color: var(--muted);
    opacity: 0; transition: opacity .2s; pointer-events: none;
    text-shadow: 0 1px 3px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .painting:hover .label { opacity: 1; }

  .horizon {
    position: absolute; left: 50%; top: 38%; width: 500px; height: 220px;
    transform: translateX(-50%) translateZ(-5500px);
    background: radial-gradient(ellipse, rgba(224,139,189,.22) 0%, transparent 70%);
    pointer-events: none;
  }

  .passer {
    position: absolute; bottom: 16%; left: 50%;
    width: 80px; height: 150px;
    transform: translateX(-50%) translateZ(-500px);
    opacity: 0; pointer-events: none;
  }
  .passer svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 14px rgba(0,0,0,.55)); }

  .viewer {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(6,4,8,.94);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .28s;
  }
  .viewer.open { opacity: 1; pointer-events: auto; }
  .viewer img {
    max-width: 94vw; max-height: 90vh; object-fit: contain;
    border-radius: 4px; box-shadow: 0 24px 70px rgba(0,0,0,.7);
  }
  .viewer .close {
    position: absolute; top: 14px; right: 14px;
    width: 46px; height: 46px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.12); color: #fff; font-size: 24px; cursor: pointer;
  }
  .viewer .info {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.6); padding: 8px 20px; border-radius: 999px;
    font-size: .9rem; color: #eee; max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  @media (max-width: 700px) {
    .painting { width: 130px; height: 175px; }
    .wall.left  { transform: translateX(-50%) rotateY(90deg) translateZ(-230px); }
    .wall.right { transform: translateX(50%) rotateY(-90deg) translateZ(-230px); }
  }
</style>
</head>

<div class="hud">
  <div>
    <h1>Korytarz Versailles</h1>
    <span class="counter" id="counter"></span>
  </div>
  <div class="controls">
    <button class="btn" id="btnWalk">▶ Marsz</button>
    <button class="btn" id="btnReset">↺ Start</button>
    <button class="btn" id="btnPassers">Przechodnie: ON</button>
    <a class="btn" href="index.html" style="text-decoration:none">← Klasyczna galeria</a>
  </div>
</div>
<div class="hint" id="hint">Scroll / ↑↓ / przeciągnij — idź korytarzem · kliknij obraz · Spacja = marsz</div>

<div class="scene" id="scene">
  <div class="corridor" id="corridor">
    <div class="ceiling"></div>
    <div class="floor"></div>
    <div class="wall left"><div class="wall-inner" id="wallL"></div></div>
    <div class="wall right"><div class="wall-inner" id="wallR"></div></div>
    <div class="horizon"></div>
    <div class="passer" id="passer"></div>
  </div>
</div>

<div class="viewer" id="viewer">
  <button class="close" id="vclose" aria-label="Zamknij">×</button>
  <img id="vimg" alt="">
  <div class="info" id="vinfo"></div>
</div>

const enc = (p) => p.split('/').map(encodeURIComponent).join('/');

let z = 0;
const MAX_Z = -5200;
const MIN_Z = 60;
let autoWalk = false;
let passersOn = true;
let lastPasser = 0;
const PASSER_INTERVAL = 40000;

const corridor = document.getElementById('corridor');
const passerEl = document.getElementById('passer');
const hint = document.getElementById('hint');
const counter = document.getElementById('counter');

function buildPaintings() {
  const wallL = document.getElementById('wallL');
  const wallR = document.getElementById('wallR');
  wallL.innerHTML = '';
  wallR.innerHTML = '';

  const spacing = 155;
  PAINTINGS.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'painting';
    el.style.top = (14 + (i % 5) * 2.2) + '%';
    const depth = 180 + i * spacing;
    el.style.left = depth + 'px';

    if (p.ar && p.ar > 0) {
      const h = 220;
      const w = Math.round(h * p.ar);
      el.style.width = Math.min(190, Math.max(110, w)) + 'px';
      el.style.height = h + 'px';
    }

    el.innerHTML = `
      <div class="frame"></div>
      <img src="${enc(p.src)}" alt="${p.title.replace(/"/g,'&quot;')}" loading="lazy" decoding="async">
      <div class="label">${p.title}</div>`;
    el.addEventListener('click', () => openViewer(p));
    if (i % 2 === 0) wallL.appendChild(el);
    else wallR.appendChild(el);
  });
  counter.textContent = PAINTINGS.length + ' obrazów';
}

function setPosition(newZ) {
  z = Math.max(MAX_Z, Math.min(MIN_Z, newZ));
  corridor.style.transform = `translateX(-50%) translateZ(${z}px)`;
}
function walk(delta) { setPosition(z + delta); }

function toggleWalk() {
  autoWalk = !autoWalk;
  const b = document.getElementById('btnWalk');
  b.textContent = autoWalk ? '⏸ Pauza' : '▶ Marsz';
  b.classList.toggle('active', autoWalk);
}

const PASSER_SVGS = {
  person: `<svg viewBox="0 0 64 128" fill="none"><circle cx="32" cy="18" r="12" fill="#c4b0c0"/><path d="M20 36c0-6 5-10 12-10s12 4 12 10v28H20V36z" fill="#8a6a7a"/><path d="M22 64h8v40h-8zM34 64h8v40h-8z" fill="#5a4a55"/><path d="M18 36h6v20h-6zM40 36h6v20h-6z" fill="#8a6a7a"/></svg>`,
  moto: `<svg viewBox="0 0 90 60" fill="none"><circle cx="18" cy="48" r="10" stroke="#ddd" stroke-width="3"/><circle cx="72" cy="48" r="10" stroke="#ddd" stroke-width="3"/><path d="M28 48h34M18 48l12-22h20l10 14" stroke="#c9a86c" stroke-width="3" stroke-linecap="round"/><circle cx="48" cy="20" r="6" fill="#e08bbd"/></svg>`,
  horse: `<svg viewBox="0 0 100 70" fill="none"><path d="M10 50c0-8 6-14 14-14h30c8 0 14 4 18 12l8 12H18l-8-10z" fill="#8b6b5a"/><path d="M72 36c6-2 12 2 14 10" stroke="#8b6b5a" stroke-width="4" stroke-linecap="round"/><circle cx="22" cy="58" r="6" fill="#3a2a22"/><circle cx="62" cy="58" r="6" fill="#3a2a22"/><path d="M78 28c4-6 10-4 12 2" stroke="#8b6b5a" stroke-width="3"/></svg>`
};

function spawnPasser() {
  if (!passersOn) return;
  const types = ['person', 'moto', 'horse'];
  const type = types[Math.floor(Math.random() * types.length)];
  passerEl.innerHTML = PASSER_SVGS[type];
  const startX = Math.random() > 0.5 ? -300 : 300;
  const endX = -startX;
  const start = performance.now();
  const dur = 2600 + Math.random() * 800;

  function frame(now) {
    const t = Math.min(1, (now - start) / dur);
    if (t >= 1) { passerEl.style.opacity = '0'; return; }
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    const x = startX + (endX - startX) * ease;
    const opacity = t < 0.12 ? t/0.12 : t > 0.88 ? (1-t)/0.12 : 1;
    passerEl.style.opacity = opacity;
    passerEl.style.transform = `translateX(calc(-50% + ${x}px)) translateZ(${z - 380}px) scale(0.92)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  lastPasser = Date.now();
}

function openViewer(p) {
  document.getElementById('vimg').src = enc(p.src);
  document.getElementById('vinfo').textContent = p.title;
  document.getElementById('viewer').classList.add('open');
}
function closeViewer() {
  document.getElementById('viewer').classList.remove('open');
}

document.getElementById('btnWalk').onclick = toggleWalk;
document.getElementById('btnReset').onclick = () => setPosition(0);
document.getElementById('btnPassers').onclick = function() {
  passersOn = !passersOn;
  this.textContent = 'Przechodnie: ' + (passersOn ? 'ON' : 'OFF');
  this.classList.toggle('active', passersOn);
};
document.getElementById('vclose').onclick = closeViewer;
document.getElementById('viewer').addEventListener('click', e => {
  if (e.target.id === 'viewer') closeViewer();
});

let dragging = false, lastY = 0;
const scene = document.getElementById('scene');
scene.addEventListener('wheel', e => {
  e.preventDefault();
  walk(e.deltaY * 0.6);
  hint.classList.add('hide');
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    walk(e.key === 'ArrowUp' ? -45 : 45);
    hint.classList.add('hide');
  }
  if (e.key === 'Escape') closeViewer();
  if (e.key === ' ') { e.preventDefault(); toggleWalk(); }
});
scene.addEventListener('pointerdown', e => {
  if (e.target.closest('.painting') || e.target.closest('.hud')) return;
  dragging = true; lastY = e.clientY;
  scene.setPointerCapture(e.pointerId);
});
scene.addEventListener('pointermove', e => {
  if (!dragging) return;
  walk((e.clientY - lastY) * 1.3);
  lastY = e.clientY;
  hint.classList.add('hide');
});
scene.addEventListener('pointerup', () => dragging = false);
scene.addEventListener('pointercancel', () => dragging = false);

function loop() {
  if (autoWalk) walk(-1.25);
  if (passersOn && Date.now() - lastPasser > PASSER_INTERVAL) spawnPasser();
  requestAnimationFrame(loop);
}

buildPaintings();
setPosition(0);
requestAnimationFrame(loop);
setTimeout(() => hint.classList.add('hide'), 7000);
</script>

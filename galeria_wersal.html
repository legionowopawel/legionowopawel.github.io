// ── tekstury proceduralne + CDN ──
const texLoader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function makeCanvasTex(drawFn, size=512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  drawFn(ctx, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// marmur
const marbleTex = makeCanvasTex((ctx,s) => {
  const g = ctx.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#e8e0d4'); g.addColorStop(.3,'#f5f0e6'); g.addColorStop(.6,'#d4cbb8'); g.addColorStop(1,'#ebe4d6');
  ctx.fillStyle = g; ctx.fillRect(0,0,s,s);
  for (let i=0;i<40;i++){
    ctx.strokeStyle = `rgba(120,100,80,${0.04+Math.random()*0.08})`;
    ctx.beginPath();
    let x=Math.random()*s, y=Math.random()*s;
    ctx.moveTo(x,y);
    for(let k=0;k<6;k++){ x+= (Math.random()-0.5)*80; y+=(Math.random()-0.5)*80; ctx.lineTo(x,y); }
    ctx.stroke();
  }
}, 1024);
marbleTex.repeat.set(4, 1.2);

// ściana – ciepły tynk / damask
const wallTex = makeCanvasTex((ctx,s) => {
  ctx.fillStyle = '#c9b48a';
  ctx.fillRect(0,0,s,s);
  // delikatny wzór damaskowy
  ctx.fillStyle = 'rgba(160,130,90,0.12)';
  for(let y=0;y<s;y+=64) for(let x=0;x<s;x+=64){
    ctx.beginPath();
    ctx.ellipse(x+32,y+32,22,28,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x+32,y+32,10,14,0,0,Math.PI*2);
    ctx.fillStyle='rgba(180,150,110,0.1)';
    ctx.fill();
    ctx.fillStyle='rgba(160,130,90,0.12)';
  }
}, 512);
wallTex.repeat.set(6, 2);

// złota listwa
const goldTex = makeCanvasTex((ctx,s) => {
  const g = ctx.createLinearGradient(0,0,0,s);
  g.addColorStop(0,'#f0d78c'); g.addColorStop(.5,'#c9a227'); g.addColorStop(1,'#a67c00');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  for(let i=0;i<30;i++){
    ctx.fillStyle=`rgba(255,240,180,${Math.random()*0.25})`;
    ctx.fillRect(Math.random()*s, Math.random()*s, 2+Math.random()*8, 1);
  }
});

// dywan
const carpetTex = makeCanvasTex((ctx,s) => {
  ctx.fillStyle='#5c1a1a';
  ctx.fillRect(0,0,s,s);
  ctx.strokeStyle='#8b2e2e';
  ctx.lineWidth=8;
  for(let i=0;i<8;i++){
    ctx.strokeRect(20+i*8,20+i*8,s-40-i*16,s-40-i*16);
  }
  ctx.fillStyle='#c9a227';
  for(let y=40;y<s-40;y+=32) for(let x=40;x<s-40;x+=32){
    if((x+y)%64===0){ ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill(); }
  }
}, 512);
carpetTex.repeat.set(3, 1);

// rama
const frameTex = makeCanvasTex((ctx,s) => {
  const g = ctx.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#5c3a14'); g.addColorStop(.4,'#8b6914'); g.addColorStop(.7,'#3d2208'); g.addColorStop(1,'#6b4a12');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  // ornamenti
  ctx.strokeStyle='rgba(212,175,55,0.55)';
  ctx.lineWidth=6;
  ctx.strokeRect(18,18,s-36,s-36);
  ctx.lineWidth=3;
  ctx.strokeRect(32,32,s-64,s-64);
  // rogi
  ctx.fillStyle='rgba(212,175,55,0.4)';
  [[20,20],[s-40,20],[20,s-40],[s-40,s-40]].forEach(([x,y])=>{
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+20,y); ctx.lineTo(x,y+20); ctx.fill();
  });
});

// sufit
const ceilingTex = makeCanvasTex((ctx,s) => {
  ctx.fillStyle='#e8dcc8';
  ctx.fillRect(0,0,s,s);
  ctx.strokeStyle='rgba(180,160,120,0.3)';
  ctx.lineWidth=2;
  for(let i=0;i<=8;i++){ ctx.beginPath(); ctx.moveTo(i*s/8,0); ctx.lineTo(i*s/8,s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*s/8); ctx.lineTo(s,i*s/8); ctx.stroke(); }
});

const mats = {
  marble: new THREE.MeshStandardMaterial({map:marbleTex, roughness:0.35, metalness:0.05}),
  wall:   new THREE.MeshStandardMaterial({map:wallTex, roughness:0.85, metalness:0.0}),
  gold:   new THREE.MeshStandardMaterial({map:goldTex, roughness:0.4, metalness:0.65}),
  carpet: new THREE.MeshStandardMaterial({map:carpetTex, roughness:0.95, metalness:0}),
  frame:  new THREE.MeshStandardMaterial({map:frameTex, roughness:0.55, metalness:0.25}),
  ceiling:new THREE.MeshStandardMaterial({map:ceilingTex, roughness:0.9, metalness:0}),
  skin:   new THREE.MeshStandardMaterial({color:0xd4a574, roughness:0.7}),
  cloth:  new THREE.MeshStandardMaterial({color:0x4a3728, roughness:0.8}),
  dark:   new THREE.MeshStandardMaterial({color:0x222222, roughness:0.6, metalness:0.3}),
};

// ── budowa geometrii sceny ──
const clickable = [];
const groupRoot = new THREE.Group();
scene.add(groupRoot);

function box(sx,sy,sz) {
  return new THREE.BoxGeometry(sx, sy, sz);
}

function addMesh(geo, mat, x,y,z, rx=0,ry=0,rz=0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z);
  m.rotation.set(rx,ry,rz);
  m.castShadow = true;
  m.receiveShadow = true;
  groupRoot.add(m);
  return m;
}

// obiekty statyczne
for (const o of CFG.objects) {
  if (o.kind === 'floor') {
    const m = addMesh(box(o.sx, o.sy, o.sz), mats.marble, o.x, o.y, o.z);
    m.receiveShadow = true;
  } else if (o.kind === 'ceiling') {
    addMesh(box(o.sx, o.sy, o.sz), mats.ceiling, o.x, o.y, o.z);
  } else if (o.kind === 'wall' || o.kind === 'endwall') {
    addMesh(box(o.sx, o.sy, o.sz), mats.wall, o.x, o.y, o.z);
  } else if (o.kind === 'trim') {
    addMesh(box(o.sx, o.sy, o.sz), mats.gold, o.x, o.y, o.z);
  } else if (o.kind === 'carpet') {
    const m = addMesh(box(o.sx, o.sy, o.sz), mats.carpet, o.x, o.y, o.z);
    m.receiveShadow = true;
  } else if (o.kind === 'frame') {
    addMesh(box(o.sx, o.sy, o.sz), mats.frame, o.x, o.y, o.z);
  } else if (o.kind === 'painting') {
    // placeholder – tekstury obrazów ładujemy później
    const geo = box(o.sx, o.sy, o.sz);
    const mat = new THREE.MeshBasicMaterial({color:0x333333});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(o.x, o.y, o.z);
    mesh.userData = {url: BASE + o.src, title: o.title, group: o.group, kind:'painting'};
    groupRoot.add(mesh);
    clickable.push(mesh);
    // ładuj teksturę
    texLoader.load(BASE + encodeURI(o.src), (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      mesh.material = new THREE.MeshBasicMaterial({map: tex});
      mesh.material.needsUpdate = true;
    }, undefined, () => {
      mesh.material = new THREE.MeshBasicMaterial({color:0x554433});
    });
  } else if (o.kind === 'chandelier') {
    // prosta lampa: kula + ramiona
    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 12, 10),
      new THREE.MeshStandardMaterial({color:0xffe8a0, emissive:0xffcc66, emissiveIntensity:1.2, roughness:0.3})
    );
    bulb.position.set(o.x, o.y, o.z);
    groupRoot.add(bulb);
    const light = new THREE.PointLight(0xffe8c0, 1.4, 14, 1.5);
    light.position.set(o.x, o.y - 0.1, o.z);
    light.castShadow = false;
    groupRoot.add(light);
    // łańcuch
    const chain = new THREE.Mesh(
      new THREE.CylinderGeometry(0.015, 0.015, 0.7, 6),
      mats.gold
    );
    chain.position.set(o.x, o.y + 0.4, o.z);
    groupRoot.add(chain);
  }
}

// ── proste postacie (ludzie) ──
function makePerson(p) {
  const g = new THREE.Group();
  const s = p.scale;
  // ciało
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.18*s, 0.55*s, 6, 10), mats.cloth);
  body.position.y = 0.9 * s;
  g.add(body);
  // głowa
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.14*s, 10, 8), mats.skin);
  head.position.y = 1.45 * s;
  g.add(head);
  // nogi
  const legMat = new THREE.MeshStandardMaterial({color:0x2a2a2a, roughness:0.8});
  for (const sx of [-0.09, 0.09]) {
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.06*s, 0.4*s, 4, 6), legMat);
    leg.position.set(sx*s, 0.35*s, 0);
    g.add(leg);
  }
  // ramiona
  for (const sx of [-0.28, 0.28]) {
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.05*s, 0.35*s, 4, 6), mats.cloth);
    arm.position.set(sx*s, 1.05*s, 0);
    arm.rotation.z = sx > 0 ? -0.3 : 0.3;
    g.add(arm);
  }
  // kolor ubrania zależny od typu
  const colors = {walker:0x3d5a4c, tourist:0x6b4c9a, guard:0x2c3e50, noble:0x8b1a1a, artist:0x4a6fa5};
  body.material = new THREE.MeshStandardMaterial({color: colors[p.type]||0x444444, roughness:0.75});
  g.userData = {person: p, kind:'person'};
  g.castShadow = true;
  groupRoot.add(g);
  return g;
}

const personMeshes = CFG.people.map(makePerson);

// ── zwierzęta (uproszczone) ──
function makeAnimal(a) {
  const g = new THREE.Group();
  const kind = a.kind;
  if (kind === 'dog' || kind === 'cat') {
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.35, 6, 8),
      new THREE.MeshStandardMaterial({color: kind==='dog'?0x8b6914:0x666666, roughness:0.8}));
    body.rotation.z = Math.PI/2;
    body.position.y = 0.25;
    g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), body.material);
    head.position.set(0.28, 0.32, 0);
    g.add(head);
    // ogon
    const tail = new THREE.Mesh(new THREE.CapsuleGeometry(0.03, 0.2, 4, 4), body.material);
    tail.position.set(-0.28, 0.3, 0);
    tail.rotation.z = 0.6;
    g.add(tail);
  } else if (kind === 'bird') {
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6),
      new THREE.MeshStandardMaterial({color:0x4488cc, roughness:0.6}));
    body.position.y = 1.2;
    g.add(body);
    const wing = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.02, 0.12), body.material);
    wing.position.set(0, 1.2, 0);
    g.add(wing);
  } else if (kind === 'horse') {
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.7, 6, 8),
      new THREE.MeshStandardMaterial({color:0x5c3a1e, roughness:0.7}));
    body.rotation.z = Math.PI/2;
    body.position.y = 0.9;
    g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), body.material);
    head.position.set(0.55, 1.15, 0);
    g.add(head);
    for (const [x,z] of [[0.25,0.12],[0.25,-0.12],[-0.25,0.12],[-0.25,-0.12]]) {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.7,6), body.material);
      leg.position.set(x, 0.35, z);
      g.add(leg);
    }
  } else { // peacock
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6),
      new THREE.MeshStandardMaterial({color:0x1a6b4a, roughness:0.5, metalness:0.3}));
    body.position.y = 0.35;
    g.add(body);
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.9, 8),
      new THREE.MeshStandardMaterial({color:0x2ecc71, roughness:0.4, metalness:0.4}));
    tail.rotation.x = -Math.PI/2;
    tail.position.set(-0.35, 0.5, 0);
    g.add(tail);
  }
  g.userData = {animal: a, kind:'animal'};
  g.castShadow = true;
  groupRoot.add(g);
  return g;
}

const animalMeshes = CFG.animals.map(makeAnimal);

// ── 5 motorów ──
function makeMotorcycle(m) {
  const g = new THREE.Group();
  const col = new THREE.Color(m.color);
  const bodyMat = new THREE.MeshStandardMaterial({color: col, roughness:0.35, metalness:0.7});
  const darkMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.5, metalness:0.4});
  const s = m.scale;

  // rama / zbiornik
  const tank = new THREE.Mesh(new THREE.CapsuleGeometry(0.12*s, 0.45*s, 6, 8), bodyMat);
  tank.rotation.z = Math.PI/2;
  tank.position.set(0, 0.55*s, 0);
  g.add(tank);

  // siedzenie
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.35*s, 0.08*s, 0.2*s), darkMat);
  seat.position.set(-0.05*s, 0.62*s, 0);
  g.add(seat);

  // koła
  for (const x of [-0.38*s, 0.38*s]) {
    const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.22*s, 0.06*s, 8, 16), darkMat);
    wheel.rotation.y = Math.PI/2;
    wheel.position.set(x, 0.22*s, 0);
    g.add(wheel);
    // felga
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06*s,0.06*s,0.04*s,8), mats.gold);
    hub.rotation.z = Math.PI/2;
    hub.position.set(x, 0.22*s, 0);
    g.add(hub);
  }

  // kierownica
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.015*s,0.015*s,0.4*s,6), darkMat);
  handle.rotation.x = Math.PI/2;
  handle.position.set(0.28*s, 0.75*s, 0);
  g.add(handle);

  // kierowca (siedzi)
  const riderBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.14*s, 0.3*s, 5, 8),
    new THREE.MeshStandardMaterial({color:0x222222, roughness:0.7}));
  riderBody.position.set(-0.02*s, 0.95*s, 0);
  riderBody.rotation.x = 0.25;
  g.add(riderBody);
  const riderHead = new THREE.Mesh(new THREE.SphereGeometry(0.11*s, 8, 6), mats.skin);
  riderHead.position.set(0.02*s, 1.25*s, 0);
  g.add(riderHead);
  // kask
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.125*s, 8, 6), bodyMat);
  helmet.position.set(0.02*s, 1.28*s, 0);
  g.add(helmet);

  // wydech / detale zależne od typu
  if (m.type === 'chopper') {
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.03*s,0.025*s,0.6*s,6), mats.gold);
    pipe.rotation.z = Math.PI/2;
    pipe.position.set(-0.1*s, 0.3*s, 0.18*s);
    g.add(pipe);
  } else if (m.type === 'sport') {
    const fairing = new THREE.Mesh(new THREE.BoxGeometry(0.3*s, 0.2*s, 0.35*s), bodyMat);
    fairing.position.set(0.25*s, 0.65*s, 0);
    g.add(fairing);
  }

  g.userData = {moto: m, kind:'moto'};
  g.castShadow = true;
  groupRoot.add(g);
  return g;
}

const motoMeshes = CFG.motorcycles.map(makeMotorcycle);

// ── sterowanie ──
const controls = new PointerLockControls(camera, renderer.domElement);
scene.add(controls.getObject());

const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Escape') controls.unlock(); });
addEventListener('keyup', e => { keys[e.code] = false; });

renderer.domElement.addEventListener('click', () => {
  if (!controls.isLocked) controls.lock();
});

// raycast do obrazów
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(clickable, false);
  return hits.length ? hits[0].object : null;
}

renderer.domElement.addEventListener('pointermove', e => {
  if (controls.isLocked) { tip.style.display='none'; return; }
  const m = pick(e);
  if (m) {
    tip.textContent = m.userData.group + '\n' + m.userData.title;
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX+14, innerWidth-360)+'px';
    tip.style.top = (e.clientY+14)+'px';
    renderer.domElement.style.cursor = 'pointer';
  } else {
    tip.style.display = 'none';
    renderer.domElement.style.cursor = 'default';
  }
});

// ── animacja ──
const clock = new THREE.Clock();
const totalLen = CFG.total_length;
const halfW = CFG.corridor_width * 0.35;

function pathPos(t, side) {
  // t w [0,1) – pozycja wzdłuż całej galerii
  const x = t * totalLen;
  const z = side * halfW * 0.7;
  return [x, z];
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.08);
  const t = clock.elapsedTime;

  // chodzenie
  if (controls.isLocked) {
    const speed = (keys.ShiftLeft || keys.ShiftRight) ? 4.2 : 2.4;
    const dir = new THREE.Vector3();
    if (keys.KeyW || keys.ArrowUp) dir.z -= 1;
    if (keys.KeyS || keys.ArrowDown) dir.z += 1;
    if (keys.KeyA || keys.ArrowLeft) dir.x -= 1;
    if (keys.KeyD || keys.ArrowRight) dir.x += 1;
    if (dir.lengthSq()) {
      dir.normalize().multiplyScalar(speed * dt);
      controls.moveRight(dir.x);
      controls.moveForward(-dir.z);
    }
    // grawitacja / wysokość
    controls.getObject().position.y = CFG.eye;
    // ograniczenie do korytarza
    const p = controls.getObject().position;
    p.z = Math.max(-CFG.corridor_width/2+0.6, Math.min(CFG.corridor_width/2-0.6, p.z));
    p.x = Math.max(0.5, Math.min(totalLen-0.5, p.x));
  }

  // postacie
  personMeshes.forEach((mesh, i) => {
    const p = CFG.people[i];
    const tt = (t * p.speed * 0.03 + p.path_offset) % 1;
    const [x, z] = pathPos(tt, p.side * 0.85);
    mesh.position.set(x, 0, z);
    // kierunek ruchu
    const nextT = (tt + 0.002) % 1;
    const [nx] = pathPos(nextT, p.side * 0.85);
    mesh.rotation.y = Math.atan2(0, nx - x) + (nx < x ? Math.PI : 0);
    // lekkie kołysanie
    mesh.children[0].position.y = 0.9 * p.scale + Math.sin(t * 6 + i) * 0.02;
  });

  // zwierzęta
  animalMeshes.forEach((mesh, i) => {
    const a = CFG.animals[i];
    const tt = (t * a.speed * 0.025 + a.path_offset) % 1;
    const [x, z] = pathPos(tt, a.side * 0.6);
    mesh.position.set(x, 0, z);
    const nextT = (tt + 0.002) % 1;
    const [nx] = pathPos(nextT, a.side * 0.6);
    mesh.rotation.y = Math.atan2(0, nx - x) + (nx < x ? Math.PI : 0);
    if (a.kind === 'bird') {
      mesh.position.y = 1.1 + Math.sin(t * 3 + i) * 0.25;
      mesh.children[1].rotation.z = Math.sin(t * 12 + i) * 0.4;
    }
  });

  // motory – szybsze, jeżdżą środkiem
  motoMeshes.forEach((mesh, i) => {
    const m = CFG.motorcycles[i];
    const tt = (t * m.speed * 0.02 + m.path_offset) % 1;
    const [x, z] = pathPos(tt, m.side);
    mesh.position.set(x, 0, z);
    const nextT = (tt + 0.003) % 1;
    const [nx] = pathPos(nextT, m.side);
    mesh.rotation.y = Math.atan2(0, nx - x) + (nx < x ? Math.PI : 0);
    // lekkie przechylenie
    mesh.rotation.z = Math.sin(t * 2 + i) * 0.03;
  });

  renderer.render(scene, camera);
}

// ── start ──
let loaded = 0;
const totalTex = CFG.objects.filter(o => o.kind === 'painting').length + 6;
function tickLoad() {
  loaded++;
  prog.style.width = Math.min(100, (loaded / totalTex) * 100) + '%';
}

// pre-load a few
['marble','wall','gold','carpet','frame','ceiling'].forEach(() => tickLoad());

msg.querySelector('small').textContent = `Obrazy: ${CFG.images.length} · Korytarze: ${CFG.rooms.length} · Postacie: ${CFG.people.length} · Motory: 5`;
setTimeout(() => {
  msg.remove();
  prog.parentElement.style.display = 'none';
  animate();
}, 600);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Galeria 3D – Komiksy AI (Wolfenstein style)</title>
<style>
:root {
  --bar-h: 52px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --accent: #c44;
  --bg: #0a0a0c;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #eee; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
#gameWrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
#modeBar {
  flex: none; height: calc(var(--bar-h) + var(--safe-top)); padding-top: var(--safe-top);
  background: #111; border-bottom: 1px solid #333; display: flex; align-items: center;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none; z-index: 20;
}
#modeBar::-webkit-scrollbar { display: none; }
.modeBtn {
  flex: none; min-width: 48px; min-height: 48px; padding: 6px 12px; margin: 0 3px;
  border: 1px solid #444; border-radius: 8px; background: #1a1a1a; color: #ccc;
  font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
}
.modeBtn.active { background: var(--accent); color: #fff; border-color: #e66; }
#canvasBox { flex: 1; position: relative; min-height: 0; background: #000; }
#view {
  position: absolute; inset: 0; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
  touch-action: none; cursor: crosshair;
}
#hud {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(8px + var(--safe-bot));
  pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end;
  background: linear-gradient(transparent, rgba(0,0,0,.55)); font-size: 13px; z-index: 5;
}
#hud span { background: rgba(0,0,0,.45); padding: 3px 8px; border-radius: 6px; }
#demoLabel {
  position: absolute; top: calc(var(--bar-h) + var(--safe-top) + 6px); left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.7); color: #fff; padding: 6px 14px; border-radius: 8px;
  font-size: 14px; font-weight: 600; z-index: 15; display: none; pointer-events: none;
}
#joystick {
  position: absolute; left: 16px; bottom: calc(70px + var(--safe-bot)); width: 110px; height: 110px;
  border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.25);
  z-index: 10; touch-action: none; display: none;
}
#joyKnob {
  position: absolute; width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255,255,255,.45); left: 31px; top: 31px; pointer-events: none;
}
#actionBtns {
  position: absolute; right: 12px; bottom: calc(70px + var(--safe-bot));
  display: flex; flex-direction: column; gap: 8px; z-index: 10;
}
.actBtn {
  min-width: 52px; min-height: 52px; border-radius: 12px; border: 2px solid #555;
  background: rgba(30,30,30,.85); color: #fff; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; pointer-events: auto;
}
.actBtn:active, .actBtn.on { background: var(--accent); border-color: #e88; }
#panel {
  position: absolute; inset: 0; background: rgba(0,0,0,.82); z-index: 30;
  display: none; flex-direction: column; padding: 12px; overflow: auto;
  padding-top: calc(12px + var(--safe-top)); padding-bottom: calc(12px + var(--safe-bot));
}
#panel.open { display: flex; }
#panel h2 { font-size: 1.1rem; margin-bottom: 10px; }
#panel .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
#panel label { font-size: 13px; min-width: 90px; }
#panel input[type=range] { flex: 1; min-width: 100px; }
#panel button {
  min-height: 44px; padding: 8px 12px; border-radius: 8px; border: 1px solid #555;
  background: #222; color: #eee; font-size: 13px; cursor: pointer;
}
#panel button.active { background: var(--accent); }
#panel .swatch {
  width: 40px; height: 40px; border-radius: 8px; border: 2px solid #444; cursor: pointer;
}
#panel .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
#closePanel {
  align-self: flex-end; min-width: 48px; min-height: 48px; font-size: 22px;
  background: #333; border: 0; border-radius: 10px; color: #fff; cursor: pointer; margin-bottom: 8px;
}
#descOverlay {
  position: absolute; inset: 0; background: rgba(0,0,0,.88); z-index: 40;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px; text-align: center;
}
#descOverlay.open { display: flex; }
#descOverlay img { max-width: 90%; max-height: 55vh; object-fit: contain; border-radius: 8px; margin-bottom: 12px; }
#descOverlay h3 { font-size: 1.2rem; margin-bottom: 6px; }
#descOverlay p { color: #aaa; font-size: 14px; max-width: 400px; }
#descClose {
  margin-top: 16px; min-width: 48px; min-height: 48px; padding: 10px 24px;
  border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer;
}
#centerPreview {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  max-width: 85%; max-height: 70%; z-index: 25; display: none;
  border: 3px solid #fff; border-radius: 6px; box-shadow: 0 8px 32px rgba(0,0,0,.7);
  pointer-events: none;
}
#centerPreview.show { display: block; }
#toast {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 10px;
  font-size: 14px; z-index: 50; display: none; pointer-events: none;
}
#fps { position: absolute; top: 4px; right: 8px; font-size: 11px; color: #6f6; z-index: 12; opacity: .7; }
@media (orientation: landscape) {
  #joystick { display: none; }
  #actionBtns { bottom: calc(20px + var(--safe-bot)); }
}
</style>
</head>
<body>
<div id="gameWrap">
  <div id="modeBar" role="toolbar" aria-label="Tryby">
    <button class="modeBtn active" data-mode="explore">Zwiedzanie</button>
    <button class="modeBtn" data-mode="paint">Malowanie</button>
    <button class="modeBtn" data-mode="tomato">Pomidory</button>
    <button class="modeBtn" data-mode="fog">Mgła i światło</button>
    <button class="modeBtn" data-mode="sounds">Dźwięki</button>
    <button class="modeBtn" data-mode="demo">Auto-demo</button>
    <button class="modeBtn" data-mode="options">Opcje</button>
  </div>
  <div id="canvasBox">
    <canvas id="view" width="320" height="180"></canvas>
    <div id="demoLabel"></div>
    <img id="centerPreview" alt="">
    <div id="hud">
      <span id="hudLeft">FPS: —</span>
      <span id="hudRight">🍅 5</span>
    </div>
    <div id="joystick"><div id="joyKnob"></div></div>
    <div id="actionBtns">
      <button class="actBtn" id="btnBrush" title="Pędzel">🖌️</button>
      <button class="actBtn" id="btnTomato" title="Pomidor">🍅</button>
      <button class="actBtn" id="btnSound" title="Dźwięk">🔊</button>
      <button class="actBtn" id="btnMenu" title="Menu">☰</button>
    </div>
    <div id="fps"></div>
  </div>
</div>

<div id="panel">
  <button id="closePanel" aria-label="Zamknij">✕</button>
  <div id="panelContent"></div>
</div>

<div id="descOverlay">
  <img id="descImg" alt="">
  <h3 id="descTitle"></h3>
  <p id="descText"></p>
  <button id="descClose">Zamknij</button>
</div>
<div id="toast"></div>

/* 0 = puste, 1 = ściana zwykła, 2+ = ściana z obrazem (index + 2) */
const MAP_W = 24, MAP_H = 18;
const map = [];
const wallTex = [];            // ImageData / canvas per ściana (malowanie)
const wallHasImg = [];         // który obraz na ścianie

function initMap() {
  for (let y = 0; y < MAP_H; y++) {
    map[y] = [];
    wallTex[y] = [];
    wallHasImg[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      map[y][x] = 0;
      wallTex[y][x] = null;
      wallHasImg[y][x] = -1;
    }
  }
  // obramowanie
  for (let x = 0; x < MAP_W; x++) { map[0][x] = 1; map[MAP_H-1][x] = 1; }
  for (let y = 0; y < MAP_H; y++) { map[y][0] = 1; map[y][MAP_W-1] = 1; }

  // korytarze i pokoje
  const walls = [
    // poziome
    [2,3,8,3],[10,3,16,3],[18,3,22,3],
    [2,7,6,7],[8,7,14,7],[16,7,22,7],
    [2,11,10,11],[12,11,22,11],
    [4,14,12,14],[14,14,20,14],
    // pionowe
    [5,1,5,5],[9,1,9,6],[13,1,13,5],[17,1,17,6],
    [3,8,3,13],[7,8,7,12],[11,8,11,14],[15,8,15,13],[19,8,19,14],
    [6,12,6,16],[10,12,10,16],[16,12,16,16],
  ];
  walls.forEach(([x1,y1,x2,y2]) => {
    if (y1 === y2) {
      for (let x = Math.min(x1,x2); x <= Math.max(x1,x2); x++) map[y1][x] = 1;
    } else {
      for (let y = Math.min(y1,y2); y <= Math.max(y1,y2); y++) map[y][x1] = 1;
    }
  });

  // drzwi / otwory
  [[5,3],[9,4],[13,3],[17,4],[3,9],[7,10],[11,9],[15,10],[19,9],
   [6,14],[10,14],[16,14]].forEach(([x,y]) => { map[y][x] = 0; });

  // rozmieszczenie obrazów na ścianach (kolejne indeksy)

}

/* ---------- gracz ---------- */
const player = {
  x: 2.5, y: 2.5,
  dirX: 1, dirY: 0,
  planeX: 0, planeY: 0.66,
  moving: false, speed: 0
};

/* ---------- canvas i bufory ---------- */
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d', { alpha: false });
let screenW = W0, screenH = H0;
let imgData = null;
let zBuffer = new Float32Array(W0);

/* tekstury obrazów (załadowane) */
const texImages = [];
const texCanvas = [];          // canvas 64x64 z obrazem + warstwa farby
const paintLayer = [];         // osobna warstwa farby (ImageData)

function loadTextures() {
  return Promise.all(IMAGES.map((im, i) => new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      texImages[i] = img;
      const c = document.createElement('canvas');
      c.width = TEX_SIZE; c.height = TEX_SIZE;
      const cctx = c.getContext('2d');
      // skaluj zachowując proporcje, wypełnij tłem
      cctx.fillStyle = '#2a2a2a';
      cctx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
      const ar = im.w / im.h;
      let dw, dh, ox, oy;
      if (ar > 1) {
        dw = TEX_SIZE; dh = TEX_SIZE / ar; ox = 0; oy = (TEX_SIZE - dh) / 2;
      } else {
        dh = TEX_SIZE; dw = TEX_SIZE * ar; ox = (TEX_SIZE - dw) / 2; oy = 0;
      }
      cctx.drawImage(img, ox, oy, dw, dh);
      texCanvas[i] = c;
      // warstwa farby (przezroczysta)
      const pc = document.createElement('canvas');
      pc.width = TEX_SIZE; pc.height = TEX_SIZE;
      paintLayer[i] = pc;
      resolve();
    };
    img.onerror = () => resolve();
    img.src = im.src;
  })));
}

/* zwykła tekstura ściany (cegła) */
let brickTex = null;
function makeBrick() {
  const c = document.createElement('canvas');
  c.width = TEX_SIZE; c.height = TEX_SIZE;
  const g = c.getContext('2d');
  g.fillStyle = '#5a4030';
  g.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
  g.strokeStyle = '#3a2818';
  g.lineWidth = 2;
  for (let row = 0; row < 8; row++) {
    const y = row * 8;
    g.beginPath(); g.moveTo(0, y); g.lineTo(TEX_SIZE, y); g.stroke();
    const off = (row % 2) * 16;
    for (let x = off; x < TEX_SIZE; x += 32) {
      g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 8); g.stroke();
    }
  }
  // szum
  const id = g.getImageData(0, 0, TEX_SIZE, TEX_SIZE);
  for (let i = 0; i < id.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 18;
    id.data[i] = Math.max(0, Math.min(255, id.data[i] + n));
    id.data[i+1] = Math.max(0, Math.min(255, id.data[i+1] + n));
    id.data[i+2] = Math.max(0, Math.min(255, id.data[i+2] + n));
  }
  g.putImageData(id, 0, 0);
  brickTex = c;
}

/* ---------- jakość i rozdzielczość ---------- */
function applyQuality() {
  let scale = 1, maxDist = 16;
  if (state.quality === 'low') { scale = 0.5; maxDist = 10; }
  else if (state.quality === 'medium') { scale = 0.75; maxDist = 14; }
  else { scale = 1; maxDist = 18; }
  state.resScale = scale;
  state.maxDist = maxDist;
  screenW = Math.max(160, Math.floor(W0 * scale));
  screenH = Math.max(90, Math.floor(H0 * scale));
  // orientacja pionowa: zamieniamy (rysujemy „na stojąco”)
  if (state.portrait) {
    canvas.width = screenH;
    canvas.height = screenW;
  } else {
    canvas.width = screenW;
    canvas.height = screenH;
  }
  imgData = ctx.createImageData(canvas.width, canvas.height);
  zBuffer = new Float32Array(canvas.width);
  markUsed('quality_' + state.quality);
}

/* ---------- raycasting (kolumnami) ---------- */
function castRays() {
  if (!state.pageVisible) return;
  const w = canvas.width, h = canvas.height;
  const data = imgData.data;
  const fogOn = state.fogOn && state.features.fog;
  const fogD = state.fogDensity;
  const [fr, fg, fb] = state.fogColor;
  const bright = state.brightness;
  const maxD = state.maxDist || 16;

  // sufit / podłoga
  for (let y = 0; y < h; y++) {
    const isCeil = y < h / 2;
    const t = isCeil ? (h/2 - y) / (h/2) : (y - h/2) / (h/2);
    const shade = 0.15 + t * 0.25;
    const r = Math.floor(30 * shade * bright);
    const g = Math.floor(28 * shade * bright);
    const b = Math.floor(35 * shade * bright);
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      data[i] = r; data[i+1] = g; data[i+2] = b; data[i+3] = 255;
    }
  }

  const portrait = state.portrait;
  // w trybie pionowym: wirtualna szerokość = wysokość canvasu (patrząc „w górę” ekranu)
  const rayCount = portrait ? h : w;
  const colH = portrait ? w : h;

  for (let col = 0; col < rayCount; col++) {
    const cameraX = 2 * col / rayCount - 1;
    const rayDirX = player.dirX + player.planeX * cameraX;
    const rayDirY = player.dirY + player.planeY * cameraX;

    let mapX = player.x | 0, mapY = player.y | 0;
    let sideDistX, sideDistY;
    const deltaDistX = Math.abs(1 / (rayDirX || 1e-8));
    const deltaDistY = Math.abs(1 / (rayDirY || 1e-8));
    let stepX, stepY, hit = 0, side = 0;

    if (rayDirX < 0) { stepX = -1; sideDistX = (player.x - mapX) * deltaDistX; }
    else { stepX = 1; sideDistX = (mapX + 1 - player.x) * deltaDistX; }
    if (rayDirY < 0) { stepY = -1; sideDistY = (player.y - mapY) * deltaDistY; }
    else { stepY = 1; sideDistY = (mapY + 1 - player.y) * deltaDistY; }

    let dist = 0;
    while (!hit && dist < maxD) {
      if (sideDistX < sideDistY) {
        sideDistX += deltaDistX; mapX += stepX; side = 0;
      } else {
        sideDistY += deltaDistY; mapY += stepY; side = 1;
      }
      dist = side === 0 ? sideDistX : sideDistY;
      if (mapY < 0 || mapY >= MAP_H || mapX < 0 || mapX >= MAP_W) { hit = 1; break; }
      if (map[mapY][mapX] > 0) hit = 1;
    }

    let perpWallDist;
    if (side === 0) perpWallDist = (mapX - player.x + (1 - stepX) / 2) / (rayDirX || 1e-8);
    else perpWallDist = (mapY - player.y + (1 - stepY) / 2) / (rayDirY || 1e-8);
    perpWallDist = Math.max(0.01, Math.abs(perpWallDist));
    zBuffer[col] = perpWallDist;

    const lineH = Math.min(colH * 2.5, (colH / perpWallDist) | 0);
    let drawStart = ((colH - lineH) / 2) | 0;
    let drawEnd = ((colH + lineH) / 2) | 0;
    if (drawStart < 0) drawStart = 0;
    if (drawEnd >= colH) drawEnd = colH - 1;

    // tekstura
    let wallX;
    if (side === 0) wallX = player.y + perpWallDist * rayDirY;
    else wallX = player.x + perpWallDist * rayDirX;
    wallX -= Math.floor(wallX);

    let texX = (wallX * TEX_SIZE) | 0;
    if (side === 0 && rayDirX > 0) texX = TEX_SIZE - texX - 1;
    if (side === 1 && rayDirY < 0) texX = TEX_SIZE - texX - 1;

    const cell = (mapY >= 0 && mapY < MAP_H && mapX >= 0 && mapX < MAP_W) ? map[mapY][mapX] : 1;
    const imgId = cell >= 2 ? cell - 2 : -1;

    let srcCanvas = brickTex;
    let paintC = null;
    if (imgId >= 0 && texCanvas[imgId]) {
      srcCanvas = texCanvas[imgId];
      paintC = paintLayer[imgId];
    }

    // pobierz ImageData tekstury (cache co klatkę nie – używamy getImageData raz na teksturę przy malowaniu)
    // dla szybkości: rysujemy przez bezpośrednie sample z canvas (wolniejsze) lub ImageData
    // tu: proste sample przez tymczasowy offscreen – optymalizacja: trzymaj ImageData
    if (!srcCanvas._id) {
      const tctx = srcCanvas.getContext('2d');
      srcCanvas._id = tctx.getImageData(0, 0, TEX_SIZE, TEX_SIZE);
    }
    const texData = srcCanvas._id.data;
    let paintData = null;
    if (paintC) {
      if (!paintC._id) {
        const pctx = paintC.getContext('2d');
        paintC._id = pctx.getImageData(0, 0, TEX_SIZE, TEX_SIZE);
      }
      paintData = paintC._id.data;
    }

    const step = TEX_SIZE / lineH;
    let texPos = (drawStart - colH / 2 + lineH / 2) * step;

    for (let y = drawStart; y <= drawEnd; y++) {
      const texY = (texPos | 0) & (TEX_SIZE - 1);
      texPos += step;
      const ti = (texY * TEX_SIZE + texX) * 4;
      let r = texData[ti], g = texData[ti+1], b = texData[ti+2];

      // farba na wierzchu
      if (paintData) {
        const pa = paintData[ti+3];
        if (pa > 10) {
          const a = pa / 255;
          r = (paintData[ti] * a + r * (1 - a)) | 0;
          g = (paintData[ti+1] * a + g * (1 - a)) | 0;
          b = (paintData[ti+2] * a + b * (1 - a)) | 0;
        }
      }

      // cień boku
      if (side === 1) { r = (r * 0.7) | 0; g = (g * 0.7) | 0; b = (b * 0.7) | 0; }

      // mgła
      if (fogOn) {
        const f = Math.min(1, perpWallDist * fogD);
        r = (r * (1 - f) + fr * f) | 0;
        g = (g * (1 - f) + fg * f) | 0;
        b = (b * (1 - f) + fb * f) | 0;
      }

      r = Math.min(255, (r * bright) | 0);
      g = Math.min(255, (g * bright) | 0);
      b = Math.min(255, (b * bright) | 0);

      // zapis piksela (z uwzględnieniem orientacji)
      let px, py;
      if (portrait) {
        // w pionie: col to wiersz (od dołu?), y to kolumna
        px = y;
        py = rayCount - 1 - col;
      } else {
        px = col;
        py = y;
      }
      if (px >= 0 && px < w && py >= 0 && py < h) {
        const i = (py * w + px) * 4;
        data[i] = r; data[i+1] = g; data[i+2] = b; data[i+3] = 255;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

/* ---------- ruch ---------- */
const keys = {};
let joyDX = 0, joyDY = 0;
let lookDX = 0;

function tryMove(dx, dy) {
  const nx = player.x + dx, ny = player.y + dy;
  const margin = 0.2;
  if (map[player.y|0][(nx + margin)|0] === 0 && map[player.y|0][(nx - margin)|0] === 0)
    player.x = nx;
  if (map[(ny + margin)|0][player.x|0] === 0 && map[(ny - margin)|0][player.x|0] === 0)
    player.y = ny;
}

function updatePlayer(dt) {
  let mx = 0, my = 0;
  if (keys['KeyW'] || keys['ArrowUp']) my += 1;
  if (keys['KeyS'] || keys['ArrowDown']) my -= 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  mx += joyDX; my += joyDY;

  const len = Math.hypot(mx, my) || 1;
  mx /= len; my /= len;
  const sp = MOVE_SPEED * (state.demoRunning ? 0.7 : 1);
  if (mx || my) {
    tryMove(player.dirX * my * sp + player.dirY * mx * sp,
            player.dirY * my * sp - player.dirX * mx * sp);
    player.moving = true;
    player.speed = Math.hypot(mx, my);
    // kroki
    if (state.features.sound && Math.random() < 0.08 * player.speed) {
      playSound(player.inPaintPuddle ? 7 : 6, player.speed);
    }
  } else {
    player.moving = false;
    player.speed = 0;
  }

  // obrót
  let rot = 0;
  if (keys['KeyQ']) rot -= 1;
  if (keys['KeyE']) rot += 1;
  rot += lookDX * state.lookSens;
  lookDX *= 0.7;
  if (Math.abs(rot) > 0.001) {
    const rs = rot * ROT_SPEED;
    const oldDX = player.dirX;
    player.dirX = player.dirX * Math.cos(rs) - player.dirY * Math.sin(rs);
    player.dirY = oldDX * Math.sin(rs) + player.dirY * Math.cos(rs);
    const oldPX = player.planeX;
    player.planeX = player.planeX * Math.cos(rs) - player.planeY * Math.sin(rs);
    player.planeY = oldPX * Math.sin(rs) + player.planeY * Math.cos(rs);
  }
}

/* ---------- malowanie i pomidory ---------- */
function getWallInFront() {
  const dist = 1.2;
  const tx = (player.x + player.dirX * dist) | 0;
  const ty = (player.y + player.dirY * dist) | 0;
  if (ty < 0 || ty >= MAP_H || tx < 0 || tx >= MAP_W) return null;
  if (map[ty][tx] === 0) return null;
  return { x: tx, y: ty, cell: map[ty][tx] };
}

function paintOnWall() {
  if (!state.features.paint) return;
  const wall = getWallInFront();
  if (!wall) return;
  let imgId = wall.cell >= 2 ? wall.cell - 2 : -1;
  // jeśli zwykła ściana – malujemy na cegłę (tworzymy tymczasową warstwę)
  if (imgId < 0) {
    // użyj wspólnej warstwy farby dla cegieł (uproszczenie: jeden globalny paint na brick)
    if (!window._brickPaint) {
      const c = document.createElement('canvas');
      c.width = TEX_SIZE; c.height = TEX_SIZE;
      window._brickPaint = c;
    }
    // nie mapujemy per-ściana dla cegieł w tej wersji – malujemy tylko obrazy
    toast('Podejdź bliżej obrazu');
    return;
  }
  const pc = paintLayer[imgId];
  if (!pc) return;
  const pctx = pc.getContext('2d');
  delete pc._id; // unieważnij cache

  const sizes = [2, 5, 10];
  const r = sizes[state.brushSize] || 5;
  // losowa pozycja wokół środka (efekt „strzału”)
  const cx = TEX_SIZE / 2 + (Math.random() - 0.5) * 20;
  const cy = TEX_SIZE / 2 + (Math.random() - 0.5) * 20;

  if (state.eraser) {
    pctx.globalCompositeOperation = 'destination-out';
    pctx.beginPath();
    pctx.arc(cx, cy, r + 2, 0, Math.PI * 2);
    pctx.fill();
    pctx.globalCompositeOperation = 'source-over';
    playSound(10);
    markUsed('eraser');
  } else {
    pctx.fillStyle = COLORS[state.colorIdx];
    pctx.beginPath();
    pctx.arc(cx, cy, r, 0, Math.PI * 2);
    pctx.fill();
    // drobne rozpryski
    for (let i = 0; i < 3; i++) {
      pctx.beginPath();
      pctx.arc(cx + (Math.random()-0.5)*r*3, cy + (Math.random()-0.5)*r*3, r*0.3, 0, Math.PI*2);
      pctx.fill();
    }
    playSound(1 + state.brushSize);
    markUsed('brush_' + ['thin','med','thick'][state.brushSize]);
    markUsed('color_' + state.colorIdx);
  }
}

function throwTomato() {
  if (!state.features.tomato) return;
  if (state.tomatoes <= 0) {
    playSound(18);
    toast('Brak pomidorów!');
    markUsed('tomato_empty');
    return;
  }
  const wall = getWallInFront();
  if (!wall || wall.cell < 2) {
    toast('Celuj w obraz');
    return;
  }
  const imgId = wall.cell - 2;
  const pc = paintLayer[imgId];
  if (!pc) return;
  const pctx = pc.getContext('2d');
  delete pc._id;

  const cx = TEX_SIZE / 2 + (Math.random() - 0.5) * 16;
  const cy = TEX_SIZE / 2 + (Math.random() - 0.5) * 16;
  // duża plama
  pctx.fillStyle = 'rgba(180,20,20,0.85)';
  pctx.beginPath();
  pctx.ellipse(cx, cy, 14, 11, Math.random(), 0, Math.PI * 2);
  pctx.fill();
  // krople
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = 10 + Math.random() * 18;
    pctx.beginPath();
    pctx.arc(cx + Math.cos(a)*d, cy + Math.sin(a)*d, 1.5 + Math.random()*3, 0, Math.PI*2);
    pctx.fill();
  }
  state.tomatoes--;
  updateHud();
  playSound(4);
  setTimeout(() => playSound(5), 80);
  markUsed('tomato_throw');
}

function clearWall() {
  const wall = getWallInFront();
  if (!wall || wall.cell < 2) return;
  const imgId = wall.cell - 2;
  const pc = paintLayer[imgId];
  if (!pc) return;
  const pctx = pc.getContext('2d');
  pctx.clearRect(0, 0, TEX_SIZE, TEX_SIZE);
  delete pc._id;
  playSound(11);
  markUsed('clear_wall');
  toast('Ściana wyczyszczona');
}

function savePNG() {

/* ---------- dźwięki (WebAudio, 20 unikalnych) ---------- */
let actx = null;
const soundDefs = [];

function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  state.audioReady = true;
  // tło: wiatr (19)
  startWind();
}

function tone(freq, dur, type, vol, slide, noise) {
  if (!actx || state.muted || !state.features.sound) return;
  const t0 = actx.currentTime;
  const g = actx.createGain();
  g.gain.value = 0;
  g.connect(actx.destination);
  let src;
  if (noise) {
    const buf = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq;
    src.connect(f); f.connect(g);
  } else {
    src = actx.createOscillator();
    src.type = type || 'sine';
    src.frequency.value = freq;
    if (slide) src.frequency.linearRampToValueAtTime(freq * slide, t0 + dur);
    src.connect(g);
  }
  const v = (vol || 0.3) * state.volume;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(v, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.start(t0);
  src.stop(t0 + dur + 0.05);
}

function playSound(id, intensity) {
  if (!state.audioReady) return;
  const i = intensity || 1;
  const det = 1 + (Math.random() - 0.5) * 0.08; // lekkie odchylenie
  markUsed('sound_' + id);
  switch (id) {
    case 1: // cienki pędzel
      tone(1200 * det, 0.06, 'triangle', 0.15 * i); break;
    case 2: // średni
      tone(600 * det, 0.1, 'square', 0.2 * i); break;
    case 3: // gruby
      tone(280 * det, 0.14, 'sawtooth', 0.25 * i); break;
    case 4: // chlupnięcie pomidora
      tone(180 * det, 0.12, 'sine', 0.35, 0.5, true); break;
    case 5: // rozbryzg
      tone(90 * det, 0.25, 'sawtooth', 0.3, 0.3, true); break;
    case 6: // kroki
      tone(120 * det, 0.05, 'triangle', 0.12 * i, 0.8); break;
    case 7: // kroki w farbie
      tone(90 * det, 0.08, 'sine', 0.18 * i, 0.6, true); break;
    case 8: // zmiana koloru
      tone(880 * det, 0.08, 'sine', 0.2); tone(1320 * det, 0.06, 'sine', 0.12); break;
    case 9: // otwarcie palety
      tone(440, 0.05, 'square', 0.15); tone(660, 0.08, 'square', 0.12); break;
    case 10: // gumka
      tone(400 * det, 0.1, 'triangle', 0.15, 1.5, true); break;
    case 11: // wyczyść ścianę
      tone(200, 0.2, 'sawtooth', 0.2, 2); break;
    case 12: // zapis PNG
      tone(523, 0.08, 'sine', 0.2); tone(659, 0.08, 'sine', 0.2); tone(784, 0.15, 'sine', 0.25); break;
    case 13: // dotknięcie obrazu
      tone(1046 * det, 0.3, 'sine', 0.25); break;
    case 14: // otwarcie opisu
      tone(392, 0.1, 'triangle', 0.2); tone(494, 0.15, 'triangle', 0.18); break;
    case 15: // zamknięcie opisu
      tone(494, 0.08, 'triangle', 0.15); tone(392, 0.12, 'triangle', 0.12); break;
    case 16: // przełączenie trybu
      tone(330, 0.06, 'square', 0.15); tone(440, 0.08, 'square', 0.12); break;
    case 17: // zebranie pomidorów
      tone(660, 0.07, 'sine', 0.22); tone(880, 0.1, 'sine', 0.2); break;
    case 18: // brak pomidorów
      tone(150, 0.2, 'sawtooth', 0.2, 0.5); break;
    case 19: // wiatr – pętla osobno
      break;
    case 20: // fanfara
      [523,659,784,1046].forEach((f,i) => setTimeout(() => tone(f, 0.2, 'square', 0.22), i*90));
      break;
  }
}

let windNodes = null;
function startWind() {
  if (!actx || windNodes) return;
  const buf = actx.createBuffer(1, actx.sampleRate * 3, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * 0.4;
  const src = actx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const f = actx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 400;
  const g = actx.createGain();
  g.gain.value = state.muted ? 0 : 0.04 * state.volume;
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start();
  windNodes = { src, g };
}
function updateWindVol() {
  if (windNodes) windNodes.g.gain.value = state.muted ? 0 : 0.04 * state.volume;
}

/* ---------- UI i tryby ---------- */
function markUsed(key) {
  state.used[key] = true;
}

function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.style.display = 'none', ms || 1800);
}

function updateHud() {
  document.getElementById('hudRight').textContent = '🍅 ' + state.tomatoes;
}

function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.modeBtn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });
  playSound(16);
  markUsed('mode_' + m);
  if (m === 'demo') startDemo();
  else stopDemo();
  if (m === 'options' || m === 'sounds' || m === 'fog' || m === 'paint') openPanel(m);
  else closePanel();
}

function openPanel(which) {
  const panel = document.getElementById('panel');
  const cont = document.getElementById('panelContent');
  panel.classList.add('open');
  let html = '';
  if (which === 'paint') {
    html = '<h2>Malowanie</h2><div class="row">';
    ['Cienki','Średni','Gruby'].forEach((n,i) => {
      html += `<button data-bs="${i}" class="${state.brushSize===i?'active':''}">${n}</button>`;
    });
    html += '</div><div class="row">';
    COLORS.forEach((c,i) => {
      html += `<div class="swatch ${state.colorIdx===i?'active':''}" data-ci="${i}" style="background:${c}"></div>`;
    });
    html += `</div><div class="row">
      <button id="pEraser" class="${state.eraser?'active':''}">Gumka</button>
      <button id="pClear">Wyczyść ścianę</button>
      <button id="pSave">Zapisz PNG</button>
    </div>`;
  } else if (which === 'fog') {
    html = `<h2>Mgła i światło</h2>
      <div class="row"><label>Gęstość</label>
        <input type="range" id="fogDens" min="0" max="40" value="${state.fogDensity*100}"></div>
      <div class="row"><label>Jasność</label>
        <input type="range" id="bright" min="40" max="160" value="${state.brightness*100}"></div>
      <div class="row"><label>Kolor mgły</label>
        <input type="color" id="fogCol" value="#${state.fogColor.map(c=>c.toString(16).padStart(2,'0')).join('')}"></div>
      <div class="row"><button id="fogToggle">${state.fogOn?'Wyłącz mgłę':'Włącz mgłę'}</button></div>`;
  } else if (which === 'sounds') {
    html = '<h2>Dźwięki (20)</h2><div class="row">';
    const names = ['Cienki','Średni','Gruby','Chlup','Rozbryzg','Krok','Krok farba','Kolor','Paleta','Gumka',
      'Wyczyść','PNG','Obraz','Opis on','Opis off','Tryb','Pomidor+','Pusty','Wiatr','Fanfara'];
    for (let i = 1; i <= 20; i++) {
      html += `<button data-snd="${i}" style="min-width:72px">${i}. ${names[i-1]}</button>`;
    }
    html += `</div><div class="row"><label>Głośność</label>
      <input type="range" id="vol" min="0" max="100" value="${state.volume*100}">
      <button id="muteBtn">${state.muted?'Włącz dźwięk':'Wycisz'}</button></div>`;
  } else if (which === 'options') {
    html = `<h2>Opcje</h2>
      <div class="row"><label>Jakość</label>
        <button data-q="low" class="${state.quality==='low'?'active':''}">Niska</button>
        <button data-q="medium" class="${state.quality==='medium'?'active':''}">Średnia</button>
        <button data-q="high" class="${state.quality==='high'?'active':''}">Wysoka</button>
      </div>
      <div class="row"><label>Czułość</label>
        <input type="range" id="sens" min="20" max="200" value="${state.lookSens*100}"></div>
      <div class="row"><label>Układ</label>
        <button id="orientBtn">${state.portrait?'Pionowy':'Poziomy'}</button></div>
      <div class="row"><label>Funkcje</label>
        <button data-ft="paint" class="${state.features.paint?'active':''}">Malowanie</button>
        <button data-ft="tomato" class="${state.features.tomato?'active':''}">Pomidory</button>
        <button data-ft="fog" class="${state.features.fog?'active':''}">Mgła</button>
        <button data-ft="sound" class="${state.features.sound?'active':''}">Dźwięk</button>
      </div>
      <div class="row"><button id="reportBtn">Raport użycia funkcji</button></div>`;
  }
  cont.innerHTML = html;
  // handlery
  cont.querySelectorAll('[data-bs]').forEach(b => b.onclick = () => {
    state.brushSize = +b.dataset.bs; state.eraser = false;
    openPanel('paint'); markUsed('brush_size');
  });
  cont.querySelectorAll('[data-ci]').forEach(b => b.onclick = () => {
    state.colorIdx = +b.dataset.ci; state.eraser = false;
    playSound(8); openPanel('paint');
  });
  const er = cont.querySelector('#pEraser');
  if (er) er.onclick = () => { state.eraser = !state.eraser; openPanel('paint'); };
  const cl = cont.querySelector('#pClear');
  if (cl) cl.onclick = clearWall;
  const sv = cont.querySelector('#pSave');
  if (sv) sv.onclick = savePNG;
  const fd = cont.querySelector('#fogDens');
  if (fd) fd.oninput = () => { state.fogDensity = fd.value / 100; markUsed('fog_density'); };
  const br = cont.querySelector('#bright');
  if (br) br.oninput = () => { state.brightness = br.value / 100; markUsed('brightness'); };
  const fc = cont.querySelector('#fogCol');
  if (fc) fc.oninput = () => {
    const h = fc.value.slice(1);
    state.fogColor = [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    markUsed('fog_color');
  };
  const ft = cont.querySelector('#fogToggle');
  if (ft) ft.onclick = () => { state.fogOn = !state.fogOn; openPanel('fog'); markUsed('fog_toggle'); };
  cont.querySelectorAll('[data-snd]').forEach(b => b.onclick = () => playSound(+b.dataset.snd));
  const vol = cont.querySelector('#vol');
  if (vol) vol.oninput = () => { state.volume = vol.value/100; updateWindVol(); markUsed('volume'); };
  const mu = cont.querySelector('#muteBtn');
  if (mu) mu.onclick = () => { state.muted = !state.muted; updateWindVol(); openPanel('sounds'); markUsed('mute'); };
  cont.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    state.quality = b.dataset.q; applyQuality(); openPanel('options');
  });
  const se = cont.querySelector('#sens');
  if (se) se.oninput = () => { state.lookSens = se.value/100; markUsed('look_sens'); };
  const ob = cont.querySelector('#orientBtn');
  if (ob) ob.onclick = () => { state.portrait = !state.portrait; applyQuality(); openPanel('options'); markUsed('orientation'); };
  cont.querySelectorAll('[data-ft]').forEach(b => b.onclick = () => {
    const k = b.dataset.ft; state.features[k] = !state.features[k]; openPanel('options'); markUsed('feature_'+k);
  });
  const rb = cont.querySelector('#reportBtn');
  if (rb) rb.onclick = showReport;
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
}

/* ---------- opis / podgląd obrazu na środku ---------- */
function interactImage() {
  const wall = getWallInFront();
  if (!wall || wall.cell < 2) return;
  const imgId = wall.cell - 2;
  const im = IMAGES[imgId];
  if (!im) return;

  // toggle podglądu na środku
  const prev = document.getElementById('centerPreview');
  if (state.centerImgId === imgId) {
    prev.classList.remove('show');
    state.centerImgId = -1;
    playSound(15);
    markUsed('close_preview');
  } else {
    prev.src = im.src;
    prev.classList.add('show');
    state.centerImgId = imgId;
    playSound(13);
    markUsed('open_preview');
    // opcjonalnie pełny opis
    // showDesc(imgId);
  }
}

function showDesc(imgId) {
  const im = IMAGES[imgId];
  if (!im) return;
  document.getElementById('descImg').src = im.src;
  document.getElementById('descTitle').textContent = im.title;
  document.getElementById('descText').textContent = im.group + ' · ' + im.title;
  document.getElementById('descOverlay').classList.add('open');
  playSound(14);
  markUsed('open_desc');
}

/* ---------- auto-demo ---------- */
const DEMO_SCRIPT = [
  { t: 'Zwiedzanie – idę korytarzem', act: () => { keys['KeyW'] = true; } },
  { t: 'Rozglądam się', act: () => { keys['KeyW'] = false; lookDX = 2; } },
  { t: 'Tryb Malowanie', act: () => setMode('paint') },
  { t: 'Cienki pędzel', act: () => { state.brushSize = 0; paintOnWall(); } },
  { t: 'Średni pędzel + kolor', act: () => { state.brushSize = 1; state.colorIdx = 3; paintOnWall(); } },
  { t: 'Gruby pędzel', act: () => { state.brushSize = 2; state.colorIdx = 0; paintOnWall(); } },
  { t: 'Gumka', act: () => { state.eraser = true; paintOnWall(); state.eraser = false; } },
  { t: 'Tryb Pomidory', act: () => setMode('tomato') },
  { t: 'Rzut pomidora', act: () => throwTomato() },
  { t: 'Mgła – gęstsza', act: () => { setMode('fog'); state.fogDensity = 0.25; state.fogOn = true; } },
  { t: 'Zmiana koloru mgły', act: () => { state.fogColor = [60, 30, 40]; } },
  { t: 'Jasność', act: () => { state.brightness = 1.2; } },
  { t: 'Dźwięki – odsłuch', act: () => { setMode('sounds'); playSound(13); } },
  { t: 'Jakość niska', act: () => { state.quality = 'low'; applyQuality(); } },
  { t: 'Jakość wysoka', act: () => { state.quality = 'high'; applyQuality(); } },
  { t: 'Zapis PNG', act: () => savePNG() },
  { t: 'Wyczyść ścianę', act: () => clearWall() },
  { t: 'Fanfara końca', act: () => { playSound(20); } },
  { t: 'Koniec demo', act: () => { stopDemo(); setMode('explore'); } },
];

let demoTimer = null;
function startDemo() {
  if (state.reducedMotion) { toast('Demo wyłączone (reduced-motion)'); return; }
  state.demoRunning = true;
  state.demoStep = 0;
  document.getElementById('demoLabel').style.display = 'block';
  runDemoStep();
  markUsed('demo_start');
}
function runDemoStep() {
  if (!state.demoRunning) return;
  if (state.demoStep >= DEMO_SCRIPT.length) { stopDemo(); return; }
  const s = DEMO_SCRIPT[state.demoStep];
  document.getElementById('demoLabel').textContent = 'Teraz: ' + s.t;
  try { s.act(); } catch(e) {}
  state.demoStep++;
  demoTimer = setTimeout(runDemoStep, 1800);
}
function stopDemo() {
  state.demoRunning = false;
  keys['KeyW'] = false;
  document.getElementById('demoLabel').style.display = 'none';
  clearTimeout(demoTimer);
}

function showReport() {
  const all = [
    'mode_explore','mode_paint','mode_tomato','mode_fog','mode_sounds','mode_demo','mode_options',
    'brush_thin','brush_med','brush_thick','eraser','color_0','color_3',
    'tomato_throw','tomato_pickup','tomato_empty','clear_wall','save_png',
    'fog_density','fog_color','fog_toggle','brightness',
    'quality_low','quality_medium','quality_high',
    'sound_1','sound_4','sound_6','sound_13','sound_20',
    'open_preview','demo_start','volume','mute','look_sens','orientation'
  ];
  // uzupełnij markery z dźwięków 1-20
  for (let i = 1; i <= 20; i++) all.push('sound_' + i);
  let lines = all.map(k => {
    const ok = !!state.used[k];
    return (ok ? '✓' : '✗') + ' ' + k;
  });
  const usedN = all.filter(k => state.used[k]).length;
  alert('Raport użycia funkcji (' + usedN + '/' + all.length + '):\n\n' + lines.join('\n'));
  markUsed('report');
}

/* ---------- input ---------- */
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!state.audioReady) { initAudio(); }
  if (e.code === 'Space') {
    e.preventDefault();
    if (state.mode === 'paint') paintOnWall();
    else if (state.mode === 'tomato') throwTomato();
    else interactImage();
  }
  if (e.code === 'Escape') { closePanel(); stopDemo(); document.getElementById('descOverlay').classList.remove('open'); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// joystick
const joy = document.getElementById('joystick');
const knob = document.getElementById('joyKnob');
let joyTouch = null;
function showJoy(show) {
  joy.style.display = show && state.portrait ? 'block' : 'none';
}
function onJoyStart(e) {
  e.preventDefault();
  joyTouch = e.changedTouches ? e.changedTouches[0].identifier : 'mouse';
  if (!state.audioReady) initAudio();
}
function onJoyMove(e) {
  if (joyTouch === null) return;
  let t = e;
  if (e.changedTouches) {
    t = [...e.changedTouches].find(c => c.identifier === joyTouch);
    if (!t) return;
  }
  const rect = joy.getBoundingClientRect();
  let dx = (t.clientX - rect.left - 55) / 45;
  let dy = (t.clientY - rect.top - 55) / 45;
  const len = Math.hypot(dx, dy) || 1;
  if (len > 1) { dx /= len; dy /= len; }
  joyDX = dx; joyDY = -dy;
  knob.style.left = (31 + dx * 30) + 'px';
  knob.style.top = (31 + dy * 30) + 'px';
}
function onJoyEnd() {
  joyTouch = null; joyDX = 0; joyDY = 0;
  knob.style.left = '31px'; knob.style.top = '31px';
}
joy.addEventListener('touchstart', onJoyStart, {passive:false});
joy.addEventListener('touchmove', onJoyMove, {passive:false});
joy.addEventListener('touchend', onJoyEnd);
joy.addEventListener('mousedown', onJoyStart);
window.addEventListener('mousemove', e => { if (joyTouch==='mouse') onJoyMove(e); });
window.addEventListener('mouseup', onJoyEnd);

// look (przeciągnięcie)
let lookStartX = null;
canvas.addEventListener('touchstart', e => {
  if (!state.audioReady) initAudio();
  if (e.touches.length === 1) lookStartX = e.touches[0].clientX;
}, {passive:true});
canvas.addEventListener('touchmove', e => {
  if (lookStartX === null || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lookStartX;
  lookDX += dx * 0.08;
  lookStartX = e.touches[0].clientX;
}, {passive:true});
canvas.addEventListener('touchend', () => { lookStartX = null; });

// klik / tap = akcja w zależności od trybu
let tapX, tapY, tapT;
canvas.addEventListener('pointerdown', e => {
  if (!state.audioReady) initAudio();
  tapX = e.clientX; tapY = e.clientY; tapT = Date.now();
  if (state.demoRunning) { stopDemo(); toast('Demo przerwane'); }
});
canvas.addEventListener('pointerup', e => {
  if (Date.now() - tapT > 300) return;
  if (Math.hypot(e.clientX - tapX, e.clientY - tapY) > 15) return;
  if (state.mode === 'paint') paintOnWall();
  else if (state.mode === 'tomato') throwTomato();
  else interactImage();
});

// przyciski akcji
document.getElementById('btnBrush').onclick = () => {
  if (state.mode !== 'paint') setMode('paint');
  else paintOnWall();
};
document.getElementById('btnTomato').onclick = () => {
  if (state.mode !== 'tomato') setMode('tomato');
  else throwTomato();
};
document.getElementById('btnSound').onclick = () => {
  state.muted = !state.muted; updateWindVol();
  document.getElementById('btnSound').textContent = state.muted ? '🔇' : '🔊';
  markUsed('mute');
};
document.getElementById('btnMenu').onclick = () => setMode('options');
document.getElementById('closePanel').onclick = closePanel;
document.getElementById('descClose').onclick = () => {
  document.getElementById('descOverlay').classList.remove('open');
  playSound(15);
};

document.querySelectorAll('.modeBtn').forEach(b => {
  b.onclick = () => setMode(b.dataset.mode);
});

// visibility
document.addEventListener('visibilitychange', () => {
  state.pageVisible = document.visibilityState === 'visible';
});

/* ---------- pętla gry + auto-jakość ---------- */
let lastT = performance.now(), frames = 0, fps = 60, fpsAcc = 0;
function loop(t) {
  const dt = Math.min(50, t - lastT);
  lastT = t;
  frames++;
  fpsAcc += dt;
  if (fpsAcc >= 1000) {
    fps = frames; frames = 0; fpsAcc = 0;
    document.getElementById('hudLeft').textContent = 'FPS: ' + fps;
    document.getElementById('fps').textContent = fps + ' fps';
    if (state.autoQuality && !state.demoRunning) {
      if (fps < 28 && state.quality !== 'low') {
        state.quality = state.quality === 'high' ? 'medium' : 'low';
        applyQuality(); toast('Auto: ' + state.quality);
      } else if (fps > 50 && state.quality === 'low') {
        state.quality = 'medium'; applyQuality();
      }
    }
  }
  updatePlayer(dt);
  checkPickups();
  castRays();
  requestAnimationFrame(loop);
}

/* ---------- start ---------- */
async function start() {
  initMap();
  makeBrick();
  applyQuality();
  showJoy(true);
  updateHud();
  await loadTextures();
  // ustaw plane
  player.planeX = 0; player.planeY = state.fov;
  requestAnimationFrame(loop);
  toast('Dotknij ekranu, aby włączyć dźwięk. Joystick = ruch, przeciągnięcie = rozglądanie.', 3500);
}
start();
